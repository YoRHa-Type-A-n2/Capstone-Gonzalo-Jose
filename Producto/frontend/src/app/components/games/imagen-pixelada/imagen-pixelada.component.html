<div class="game-container">
  <div *ngIf="!gameOver" class="play-card">
    
    <!-- BARRA TEMPORIZADORA HORIZONAL -->
    <div style="background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(8px); padding: 4px 10px; border-radius: 10px; margin: 0 auto 2px auto; width: 95%; max-width: 700px; border: 1px solid rgba(255, 255, 255, 0.08); flex-shrink: 0;">
      <div class="timer-container" style="background: rgba(255, 255, 255, 0.12); border-radius: 9999px; overflow: hidden; height: 6px; width: 100%; margin: 0;">
        <div class="timer-bar" [style.width.%]="(elapsedTime / TOTAL_TIME) * 100" style="height: 100%; border-radius: 9999px; transition: width 0.05s linear; background-color: #2F8F6E;"></div>
      </div>
    </div>

    <!-- GRILLA ADAPTATIVA (PC: Imagen izq, Opciones der | Móvil: Imagen arriba, Opciones abajo) -->
    <div class="game-layout-grid" [class.blurred]="answered">
      
      <!-- ZONA IZQUIERDA (PC) / ARRIBA (Móvil) -> Canvas Pixelado -->
      <div class="layout-image">
        <div class="image-frame" [class.correct]="answered && isCorrect" [class.wrong]="answered && !isCorrect">
          <canvas #pixelCanvas width="300" height="300" [class.hidden]="hasImageError" class="pixel-canvas"></canvas>
          <div *ngIf="hasImageError" class="fallback-container">
            <span class="fallback-emoji">{{ challenges[currentIndex].fallbackEmoji }}</span>
          </div>
        </div>
      </div>

      <!-- ZONA DERECHA (PC) / ABAJO (Móvil) -> 5 Opciones -->
      <div class="layout-options options-column">
        <button 
          *ngFor="let option of challenges[currentIndex].options" 
          class="option-btn"
          [disabled]="answered"
          [class.correct-btn]="answered && option === challenges[currentIndex].correctCharacter"
          [class.wrong-btn]="answered && selectedOption === option && !isCorrect"
          (click)="selectOption(option)">
          <span class="bullet">▸</span>
          <span class="option-text">{{ option }}</span>
        </button>
      </div>

    </div>

    <!-- MODAL SUPERPUESTO: RETROALIMENTACIÓN / ALERTA Y BOTÓN SIGUIENTE -->
    <div *ngIf="answered" class="modal-overlay">
      <div class="modal-dialog feedback-dialog" [class.success]="isCorrect" [class.error]="!isCorrect">
        <div class="feedback-badge-icon">
          {{ isCorrect ? '🎉' : '❌' }}
        </div>
        <h3 class="status-msg">{{ isCorrect ? '¡Correcto!' : '¡Incorrecto!' }}</h3>
        <p class="explanation">
          {{ isCorrect ? '¡Has identificado el personaje con éxito!' : 'La opción no es la correcta'}}
        </p>
        <button class="btn-next" (click)="nextChallenge()">
          {{ currentIndex + 1 < challenges.length ? 'Siguiente Desafío →' : 'Siguiente' }}
        </button>
      </div>
    </div>

  </div>

  <!-- Pantalla de Resultados -->
  <div *ngIf="gameOver" class="results-card">
    <h2>🖼️ ¡Desafío Completado!</h2>
    <div class="actions">
      <button class="btn-retry" (click)="restartGame()">Reintentar</button>
      <button class="btn-menu" (click)="exitGame()">Menú Principal</button>
    </div>
  </div>
</div>
